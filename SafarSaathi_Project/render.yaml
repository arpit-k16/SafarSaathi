# Render Blueprint — one Docker web service serving the web console and the API.
services:
  - type: web
    name: safarsaathi
    runtime: docker
    rootDir: SafarSaathi_Project
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    plan: free
    envVars:
      - key: SAFARSAATHI_DATA_MODE
        value: auto
      # Only needed if the web console is ALSO hosted elsewhere (e.g. Vercel):
      - key: SAFARSAATHI_CORS_ORIGINS
        sync: false
      - key: SAFARSAATHI_CORS_ORIGIN_REGEX
        sync: false
